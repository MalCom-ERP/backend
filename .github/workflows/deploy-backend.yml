name: Deploy Backend (admin.malcom-lgc.com)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -T ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "🚀 Démarrage du déploiement Backend sur admin.malcom-lgc.com..."
            cd /var/www/malcom/backend

            echo "🔄 Synchronisation Git avec origin/main..."
            git rebase --abort || true
            rm -rf .git/rebase-merge || true
            git fetch origin
            git reset --hard origin/main

            echo "📦 Installation des dépendances Composer..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Exécution des migrations de base de données..."
            php artisan migrate --force

            echo "🔗 Création du lien symbolique storage..."
            php artisan storage:link || true

            echo "🧹 Optimisation et mise en cache Laravel..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔐 Ajustement des permissions..."
            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "🔄 Redémarrage de PHP-FPM..."
            sudo systemctl reload php8.2-fpm || true

            echo "✅ Déploiement Backend terminé avec succès !"
          EOF
