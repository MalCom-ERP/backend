<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      .bg { fill: transparent; }
      .violet { fill: #6B3AFD; }
      .text-dark { fill: #111111; }
      .text-sub { fill: #7A7A7A; }
    </style>
  </defs>
  <rect width="1024" height="1024" class="bg"/>
  
  <g transform="translate(512, 400) scale(0.65) translate(-500, -512)">
    <!-- Chevron (Outer and Inner as evenodd path) -->
    <path class="violet" fill-rule="evenodd" d="
      M 150,250 L 412,512 L 150,774 L 300,774 L 562,512 L 300,250 Z
      M 307,362 L 457,512 L 307,662 L 367,662 L 517,512 L 367,362 Z
    "/>
    <!-- C-Shape -->
    <polygon class="violet" points="350,250 850,250 720,380 610,380 742,512 610,644 720,644 850,774 350,774 612,512"/>
  </g>
  
  <!-- Text -->
  <text x="512" y="780" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" font-size="130" font-weight="900" text-anchor="middle">
    <tspan class="text-dark">Mal</tspan><tspan class="violet">Com</tspan>
  </text>
  <text x="512" y="850" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" font-size="24" font-weight="700" letter-spacing="14" text-anchor="middle" class="text-sub">VOTRE COMMERCE, PLUS FORT</text>
</svg>